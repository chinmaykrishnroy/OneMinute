name: encounter
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-encounter}
      POSTGRES_USER: ${POSTGRES_USER:-encounter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/dev.ps1 init}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/dev.ps1 init}
    command: ["/bin/sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy noeviction --save '' --appendonly no"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: infra/docker/go.Dockerfile
      args: { TARGET: ./apps/server/cmd/migrate }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-encounter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-encounter}?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  server:
    build:
      context: .
      dockerfile: infra/docker/go.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      RTC_LAB_ENABLED: ${RTC_LAB_ENABLED:-false}
      TURN_SECRET: ${TURN_SECRET}
      TURN_HOST: ${TURN_PUBLIC_IP:-127.0.0.1}:${TURN_PORT:-3478}
      DATABASE_URL: postgres://${POSTGRES_USER:-encounter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-encounter}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports: ["127.0.0.1:${API_PORT:-8080}:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    init: true
  web:
    build: ./apps/web
    environment:
      APP_ENV: ${APP_ENV:-development}
      RTC_LAB_ENABLED: ${RTC_LAB_ENABLED:-false}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8080}
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    init: true
  turn:
    build:
      context: .
      dockerfile: infra/docker/go.Dockerfile
      args: { TARGET: ./services/turn/cmd/turn }
    environment:
      APP_ENV: ${APP_ENV:-development}
      TURN_LISTEN_ADDR: :3478
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:-127.0.0.1}
      TURN_REALM: ${TURN_REALM:-local.encounter}
      TURN_SECRET: ${TURN_SECRET:?Run scripts/dev.ps1 init}
      TURN_RELAY_MIN: ${TURN_RELAY_MIN:-49160}
      TURN_RELAY_MAX: ${TURN_RELAY_MAX:-49180}
      TURN_ALLOW_PRIVATE_PEERS: ${TURN_ALLOW_PRIVATE_PEERS:-false}
    ports:
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURN_PORT:-3478}:3478/tcp"
      - "${TURN_RELAY_MIN:-49160}-${TURN_RELAY_MAX:-49180}:${TURN_RELAY_MIN:-49160}-${TURN_RELAY_MAX:-49180}/udp"
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    init: true
volumes:
  postgres-data:
