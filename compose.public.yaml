# Add after compose.yaml and compose.remote.yaml on the dedicated Linux host.
# The existing Cloudflare HTTP tunnel targets host loopback port 3000.
services:
  web:
    ports: !reset []
  gateway:
    image: caddy:2-alpine
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web: { condition: service_healthy }
      server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
